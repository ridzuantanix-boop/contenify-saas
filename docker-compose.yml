version: '3.8'

services:
  contenify-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contenify_saas
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - USE_MOCK_PROVIDERS=true
    env_file:
      - .env.local
