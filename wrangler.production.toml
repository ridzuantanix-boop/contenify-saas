AFFIMATIK_VOICE_PUBLIC_ENABLED = "true"
AFFIMATIK_MOTION_PUBLIC_ENABLED = "false"
PUBLIC_CHECKOUT_ENABLED = "true"
USE_MOCK_PROVIDERS = "false"
TUTORIAL_GUEST_USER_ID = "2dbf6927-7fa5-4aec-82bb-aa9dd01c2e9d"
TUTORIAL_GUEST_WORKSPACE_ID = "56cdeb38-6e9f-4624-9821-1f85225db95b"
TUTORIAL_GUEST_EXPIRES_AT = "2026-11-13T23:59:59+08:00"

[[services]]
