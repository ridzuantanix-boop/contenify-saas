name = "affimatik-launch-lite-staging"
main = "scripts/release/staging-worker.mjs"
compatibility_date = "2026-10-14"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "global_fetch_strictly_public"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

[vars]
DEPLOYMENT_ENV = "staging"
APP_BASE_URL = "https://affimatik-launch-lite-staging.nanotiva-garden.workers.dev"
SUPABASE_URL = "https://bymorrozeokshzuzcdro.supabase.co"
AFFIMATIK_VOICE_PUBLIC_ENABLED = "true"
AFFIMATIK_MOTION_PUBLIC_ENABLED = "false"
# Staging remains access-gated; enable checkout here for isolated QR journey QA.
PUBLIC_CHECKOUT_ENABLED = "true"
USE_MOCK_PROVIDERS = "false"
FOMO_BONUS_V1_ENABLED = "true"
FOMO_OWNER_NOTIFICATION_EMAIL = "admin@affimatik.online"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "affimatik-launch-lite-staging"
